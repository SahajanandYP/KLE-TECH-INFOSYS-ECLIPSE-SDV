name: Build Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'
          channel: 'stable'

      - name: Generate Project Scaffolding
        run: |
          flutter create sdv_app --platforms=android
          cp mobile_source/pubspec.yaml sdv_app/pubspec.yaml
          cp mobile_source/lib/main.dart sdv_app/lib/main.dart

      - name: Build APK
        run: |
          cd sdv_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virya-Digital-Key-App
          path: sdv_app/build/app/outputs/flutter-apk/app-release.apk
