<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Eclipse SDV Remote</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; color: #EDEDED; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .dashboard { text-align: center; margin-bottom: 30px; }
        .speed { font-size: 90px; font-weight: 200; color: #EDEDED; }
        .label { font-size: 14px; color: #888888; text-transform: uppercase; letter-spacing: 2px; }
        .battery-box { margin-top: 20px; font-size: 24px; color: #00CC66; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; max-width: 400px; margin-top: 30px; }
        .btn { padding: 20px 10px; background: #111; color: white; border: 1px solid #333; border-radius: 12px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn:active { background: #333; }
        .btn-primary { background: #0070F3; border-color: #0070F3; grid-column: span 2; }
        .btn-danger { background: #FF3366; border-color: #FF3366; grid-column: span 2; }
        
        .status-bar { margin-top: 40px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <!-- Bluetooth Pairing Overlay -->
    <div id="bt-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <h2 style="color: #0070F3; margin-bottom: 40px;">Virya Digital Key</h2>
        <div style="font-size: 60px; margin-bottom: 40px;">🛹</div>
        <p style="color: #888; margin-bottom: 30px; text-align: center; width: 80%;">Vehicle must be in range to establish a secure Bluetooth connection.</p>
        <button onclick="connectBluetooth()" style="padding: 15px 40px; background: #0070F3; color: white; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(0, 112, 243, 0.4);">
            PAIR VIA BLUETOOTH
        </button>
    </div>

    <div class="dashboard">
        <div class="speed" id="speed-display">--</div>
        <div class="label">km/h</div>
        <div class="battery-box" id="battery-display">--%</div>
        <div class="label" style="margin-top: 5px;">Traction Battery</div>
    </div>
    
    <div class="btn-grid">
        <button class="btn" id="lock-btn" onclick="toggleLock()">LOCKED</button>
        <button class="btn" onclick="alert('Climate Control Started')">CLIMATE</button>
        <button class="btn btn-primary" onclick="triggerOTA()">⬇️ PUSH OTA UPDATE</button>
        <button class="btn btn-danger" onclick="triggerAEB()">⚠️ EMERGENCY BRAKE</button>
    </div>
    
    <div class="status-bar" id="connection-status">Connecting to vehicle...</div>

    <script>
        // Web Bluetooth API Integration
        async function connectBluetooth() {
            try {
                // This triggers the Native Android/iOS Bluetooth Pairing Screen!
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });
                
                console.log("Bluetooth paired to: " + device.name);
                document.getElementById('bt-overlay').style.display = 'none';
                document.getElementById('connection-status').innerText = `🔵 Bluetooth Connected: ${device.name}`;
                document.getElementById('connection-status').style.color = "#0070F3";
                
                // Start telemetry loop only AFTER Bluetooth is paired
                startTelemetryLoop();
            } catch (err) {
                console.error(err);
                alert("Bluetooth connection cancelled or failed.");
            }
        }

        // Dynamically point to the Skateboard's API (port 5000)
        const API_URL = `/api`;
        
        let isLocked = true;
        
        function toggleLock() {
            isLocked = !isLocked;
            const btn = document.getElementById('lock-btn');
            btn.innerText = isLocked ? "LOCKED" : "UNLOCKED";
            btn.style.color = isLocked ? "#00CC66" : "#FFAB00";
            
            fetch(`${API_URL}/companion/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: isLocked ? "LOCK" : "UNLOCK" })
            }).catch(e => console.log(e));
        }

        function triggerOTA() {
            if(confirm("Send OTA Update signal to the vehicle? The driver will be prompted on the dashboard.")) {
                fetch(`${API_URL}/ota/trigger`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_version: "v2.0-OTA" })
                })
                .then(res => res.json())
                .then(data => alert(data.message))
                .catch(err => alert("Failed to reach vehicle API"));
            }
        }

        function triggerAEB() {
            fetch(`${API_URL}/aeb/simulate_obstacle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ distance_meters: 5.0 })
            })
            .then(res => res.json())
            .then(data => alert(data.message))
            .catch(err => alert("Failed to reach vehicle API"));
        }

        // Live Telemetry Loop (Started after BT pairing)
        function startTelemetryLoop() {
            setInterval(() => {
            fetch(`${API_URL}/telemetry`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('speed-display').innerText = Math.round(data.speed_kmh || 0);
                    document.getElementById('battery-display').innerText = `${Math.round(data.battery_soc_percent || 0)}%`;
                    document.getElementById('connection-status').innerText = "🟢 Connected to Skateboard";
                    document.getElementById('connection-status').style.color = "#00CC66";
                })
                .catch(err => {
                    document.getElementById('connection-status').innerText = "🔴 Disconnected";
                    document.getElementById('connection-status').style.color = "#FF3366";
                });
            }, 500); // 2 FPS update on mobile
        }
    </script>
</body>
</html>
